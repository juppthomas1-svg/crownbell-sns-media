<!doctype html><html><head><meta charset="utf-8"><style>
@page{size:1240px 1754px;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#16396b;--gold:#f3d58b;--red:#c8102e}
html,body{width:1240px;height:1754px}
body{position:relative;overflow:hidden;font-family:"Noto Sans CJK JP",sans-serif;color:#fff;background:var(--navy);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.photo{position:absolute;left:0;right:0;top:0;height:720px;background:url(students.jpg) 58% 30%/cover}
.fade{position:absolute;left:0;right:0;top:520px;height:202px;background:linear-gradient(0deg,var(--navy) 0%,rgba(22,57,107,0) 100%)}
.org{position:absolute;left:40px;top:36px;display:flex;align-items:center;gap:14px;background:rgba(22,57,107,.88);padding:10px 24px 10px 12px;border-radius:50px}
.org img{width:56px;height:56px;background:#fff;border-radius:50%}.org b{font-family:"Noto Serif CJK JP",serif;font-size:26px}
.cap{position:absolute;right:30px;top:688px;font-size:14px;opacity:.85}
.main{position:absolute;left:84px;right:84px;top:640px}
.tag{display:inline-block;background:var(--red);font-weight:900;font-size:38px;padding:12px 28px;letter-spacing:.08em}
.kentei{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:56px;margin-top:22px}
.row{position:relative;margin-top:80px}
.bubble{position:absolute;left:-8px;top:-64px;background:var(--gold);color:var(--navy);font-weight:900;font-size:34px;padding:8px 26px;border-radius:34px;white-space:nowrap;z-index:2}
.bubble:after{content:"";position:absolute;left:46px;bottom:-14px;border:11px solid transparent;border-top:14px solid var(--gold);border-bottom:0}
.free{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:176px;line-height:1.08;white-space:nowrap}
.free em{font-style:normal;display:inline-block;background:var(--red);padding:8px 20px 14px;margin-left:12px;line-height:1}
.flag{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:58px;margin-top:30px;white-space:nowrap}
.flag em{font-style:normal;color:var(--gold)}
.parent{font-size:34px;margin-top:12px;opacity:.95}
.facts{position:absolute;left:84px;right:390px;bottom:140px;display:flex;flex-direction:column;gap:16px}
.fact{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.35);border-radius:10px;padding:14px 26px;display:flex;align-items:center;gap:22px}
.fact b{color:var(--gold);font-size:18px;letter-spacing:.14em;width:170px}
.fact span{font-weight:700;font-size:32px}
.qrw{position:absolute;right:84px;bottom:140px;background:#fff;border-radius:14px;padding:10px;text-align:center}
.qrw img{display:block;width:250px;height:250px}
.qrw span{display:block;color:var(--navy);font-size:22px;font-weight:900;margin-top:4px}
.note{position:absolute;left:84px;right:84px;bottom:62px;font-size:19px;opacity:.88;line-height:1.6}
.line{position:absolute;left:0;right:0;bottom:0;height:14px;background:#c9a24a}
</style></head><body>
<div class="photo"></div><div class="fade"></div>
<div class="org"><img src="logo.png"><b>国際ビジネス言語認定協会</b></div>
<div class="cap">※写真はイメージです</div>
<div class="main">
<span class="tag">就活生応援キャンペーン</span>
<div class="kentei">ビジネス英語実務検定 初級</div>
<div class="row"><div class="bubble">12月25日まで</div><div class="free">受験料<em>無料</em></div></div>
<div class="flag">履歴書を、より<em>強く</em>。強みを、より<em>多く</em>。</div>
<div class="parent">お子さまの就活を、応援します。</div>
</div>
<div class="facts"><div class="fact"><b>TIME</b><span>20問・20分</span></div><div class="fact"><b>ANYTIME</b><span>スマホで24時間いつでも</span></div><div class="fact"><b>CERTIFICATE</b><span>合格すると合格証を発行</span></div></div>
<div class="qrw"><img src="qr_flyer.png"><span>読み取って無料で受験</span></div>
<div class="note">国際ビジネス言語認定協会が認定する民間資格です。無料は初級のみ・12月25日のお申し込み分まで。<br>crownbell-kentei.netlify.app</div>
<div class="line"></div>
</body></html>
