<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#16396b;--gold:#f3d58b;--red:#c8102e}
body{width:1200px;height:630px;position:relative;overflow:hidden;font-family:"Noto Sans CJK JP",sans-serif;color:#fff;background:var(--navy)}
.bg{position:absolute;inset:0;background:url(students.jpg) 75% 40%/cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(22,57,107,.95) 0%,rgba(22,57,107,.92) 50%,rgba(22,57,107,.55) 64%,rgba(22,57,107,0) 80%),linear-gradient(0deg,rgba(22,57,107,.8) 0%,rgba(22,57,107,.3) 18%,rgba(22,57,107,0) 32%)}
.top{position:absolute;left:56px;right:40px;top:30px;display:flex;justify-content:space-between;align-items:center}
.org{display:flex;align-items:center;gap:12px}.org img{width:48px;height:48px;background:#fff;border-radius:50%}
.org b{font-family:"Noto Serif CJK JP",serif;font-size:20px}
.pr{border:1px solid rgba(255,255,255,.6);font-size:16px;padding:6px 14px;background:rgba(22,57,107,.55)}
.main{position:absolute;left:56px;top:104px;width:720px}
.tag{display:inline-block;background:var(--red);font-weight:900;font-size:22px;padding:7px 16px;letter-spacing:.08em}
.kentei{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:30px;margin-top:14px}
.row{display:flex;align-items:center;gap:22px;margin-top:12px}
.free{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:80px;line-height:1.1;white-space:nowrap}
.free em{font-style:normal;display:inline-block;background:var(--red);padding:6px 12px 8px;margin-left:8px;line-height:1}
.date{font-weight:700;font-size:21px;border-top:2px solid var(--gold);border-bottom:2px solid var(--gold);padding:7px 0;white-space:nowrap}
.flag{font-family:"Noto Serif CJK JP",serif;font-weight:700;font-size:30px;margin-top:16px;white-space:nowrap}
.flag em{font-style:normal;color:var(--gold)}
.parent{font-size:18px;margin-top:6px;opacity:.92}
.facts{position:absolute;left:56px;bottom:62px;display:flex;gap:12px}
.fact{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:6px;text-align:center;padding:10px 18px;min-width:150px}
.fact b{display:block;color:var(--gold);font-size:12px;letter-spacing:.14em}
.fact span{font-weight:700;font-size:17px}
.note{position:absolute;left:56px;bottom:24px;font-size:12px;opacity:.85}
.cap{position:absolute;right:20px;bottom:24px;font-size:11px;opacity:.85}
.line{position:absolute;left:0;right:0;bottom:0;height:6px;background:#c9a24a}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="top"><div class="org"><img src="logo.png"><b>国際ビジネス言語認定協会</b></div><div class="pr">Wild English からのご紹介</div></div>
<div class="main">
<span class="tag">就活生応援キャンペーン</span>
<div class="kentei">ビジネス英語実務検定 初級</div>
<div class="row"><div class="free">受験料<em>無料</em></div><div class="date">2026年12月25日まで</div></div>
<div class="flag">履歴書を、より<em>強く</em>。強みを、より<em>多く</em>。</div>
<div class="parent">お子さまの就活を、応援します。</div>
</div>
<div class="facts"><div class="fact"><b>TIME</b><span>20問・20分</span></div><div class="fact"><b>ANYTIME</b><span>スマホで24時間</span></div><div class="fact"><b>CERTIFICATE</b><span>合格証を発行</span></div></div>
<div class="note">国際ビジネス言語認定協会が認定する民間資格です。無料は初級のみ・期間中は何度でも受験できます。</div>
<div class="cap">※写真はイメージです</div>
<div class="line"></div>
</body></html>
