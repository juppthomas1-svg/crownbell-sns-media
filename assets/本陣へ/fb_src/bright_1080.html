<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#1d4e8f;--gold:#f3d58b;--red:#c8102e}
body{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:"Noto Sans CJK JP",sans-serif;color:#fff;background:var(--navy)}
.bg{position:absolute;inset:0;background:url(students.jpg) 82% 40%/auto 92% no-repeat,var(--navy)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(29,78,143,.93) 0%,rgba(29,78,143,.85) 36%,rgba(29,78,143,.35) 56%,rgba(29,78,143,0) 70%),linear-gradient(0deg,rgba(29,78,143,.85) 0%,rgba(29,78,143,.4) 16%,rgba(29,78,143,0) 30%)}
.top{position:absolute;left:64px;right:64px;top:52px;display:flex;justify-content:space-between;align-items:center}
.org{display:flex;align-items:center;gap:14px}.org img{width:58px;height:58px;background:#fff;border-radius:50%}
.org b{font-family:"Noto Serif CJK JP",serif;font-size:24px}
.pr{border:1px solid rgba(255,255,255,.6);font-size:19px;padding:8px 16px;background:rgba(29,78,143,.55)}
.main{position:absolute;left:64px;top:160px;width:640px}
.tag{display:inline-block;background:var(--red);font-weight:900;font-size:30px;padding:10px 22px;letter-spacing:.08em}
h1{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:58px;line-height:1.3;margin-top:24px;white-space:nowrap}
h1 em{font-style:normal;color:var(--gold)}
.k{display:flex;align-items:center;gap:16px;margin-top:22px}
.k b{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:44px}
.k span{background:var(--gold);color:var(--navy);font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:40px;padding:2px 16px}
.free{margin-top:20px;font-weight:900;font-size:40px;color:var(--gold)}
.free em{font-style:normal;background:var(--red);color:#fff;padding:0 12px;margin-left:6px}
ul{list-style:none;margin-top:26px}
li{font-weight:700;font-size:25px;line-height:1.8}
li:before{content:"◆ ";color:var(--gold)}
.parent{position:absolute;left:64px;bottom:178px;font-size:30px;font-weight:700}
.btn{position:absolute;left:64px;bottom:52px;background:var(--red);font-weight:900;font-size:32px;padding:18px 36px;border-radius:4px}
.btn small{display:block;font-size:15px;font-weight:400;opacity:.9;margin-top:2px}
.note{position:absolute;right:64px;bottom:58px;font-size:15px;text-align:right;line-height:1.6;opacity:.9}
.line{position:absolute;left:0;right:0;bottom:0;height:8px;background:#c9a24a}
</style></head><body>
<div class="bg"></div><div class="shade"></div>
<div class="top"><div class="org"><img src="logo.png"><b>国際ビジネス言語認定協会</b></div><div class="pr">Wild English からのご紹介</div></div>
<div class="main">
<span class="tag">就活生応援キャンペーン</span>
<h1>履歴書を、より<em>強く</em>。<br>強みを、より<em>多く</em>。</h1>
<div class="k"><b>ビジネス英語実務検定</b><span>初級</span></div>
<div class="free">12月25日まで、受験料<em>無料</em></div>
<ul><li>スマホで20分、24時間いつでも受験</li><li>合格すると、認定番号入りの合格証を発行</li><li>履歴書の資格欄に書ける</li></ul>
</div>
<div class="parent">お子さまの就活を、応援します。</div>
<div class="btn">▶ 無料で受験する<small>crownbell-kentei.netlify.app/we</small></div>
<div class="note">国際ビジネス言語認定協会が<br>認定する民間資格です。<br>※写真はイメージです</div>
<div class="line"></div>
</body></html>
