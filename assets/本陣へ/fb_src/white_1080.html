<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#14284b;--gold:#b8923f;--red:#c8102e;--gray:#5d6472}
body{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:"Noto Sans CJK JP",sans-serif;color:var(--navy);background:#fff}
.photo{position:absolute;left:0;right:0;top:0;height:540px;background:url(students.jpg) 60% 35%/cover}
.fade{position:absolute;left:0;right:0;top:400px;height:140px;background:linear-gradient(0deg,#fff 0%,rgba(255,255,255,0) 100%)}
.top{position:absolute;left:30px;top:26px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.94);padding:8px 18px 8px 10px;border-radius:40px}
.top img{width:46px}.top b{font-family:"Noto Serif CJK JP",serif;font-size:21px}
.pr{position:absolute;right:30px;top:32px;background:rgba(255,255,255,.94);border:1px solid #d6d2c8;color:var(--gray);font-size:18px;padding:7px 14px}
.main{position:absolute;left:64px;right:64px;top:488px}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:28px;padding:9px 20px;letter-spacing:.08em}
h1{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:56px;line-height:1.26;margin-top:16px;white-space:nowrap}
h1 em{font-style:normal;color:var(--gold)}
.k{display:flex;align-items:center;gap:14px;margin-top:14px}
.k b{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:38px}
.k span{background:var(--navy);color:#fff;font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:34px;padding:0 14px}
.free{margin-top:14px;font-weight:900;font-size:38px}
.free em{font-style:normal;background:var(--red);color:#fff;padding:0 12px;margin-left:6px}
.parent{margin-top:16px;font-size:26px;font-weight:700;color:var(--gray)}
.btn{position:absolute;left:64px;bottom:44px;background:var(--red);color:#fff;font-weight:900;font-size:30px;padding:14px 32px;border-radius:4px}
.btn small{display:block;font-size:15px;font-weight:400;opacity:.92;margin-top:2px}
.note{position:absolute;right:64px;bottom:50px;font-size:16px;line-height:1.6;color:var(--gray);text-align:right}
.cap{position:absolute;right:20px;top:505px;font-size:12px;color:var(--gray)}
.line{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--gold)}
</style></head><body>
<div class="photo"></div><div class="fade"></div>
<div class="top"><img src="logo.png"><b>国際ビジネス言語認定協会</b></div>
<div class="pr">Wild English からのご紹介</div>
<div class="main">
<span class="tag">就活生応援キャンペーン</span>
<h1>履歴書を、より<em>強く</em>。<br>強みを、より<em>多く</em>。</h1>
<div class="k"><b>ビジネス英語実務検定</b><span>初級</span></div>
<div class="free">12月25日まで、受験料<em>無料</em></div>
<div class="parent">お子さまの就活を、応援します。</div>
</div>
<div class="btn">▶ 無料で受験する<small>crownbell-kentei.netlify.app/we</small></div>
<div class="note">スマホで20分・24時間いつでも受験<br>国際ビジネス言語認定協会が認定する民間資格です</div>
<div class="cap">※写真はイメージです</div>
<div class="line"></div>
</body></html>
