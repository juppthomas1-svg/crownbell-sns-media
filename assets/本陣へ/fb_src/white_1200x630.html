<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#14284b;--gold:#b8923f;--red:#c8102e;--gray:#5d6472}
body{width:1200px;height:630px;position:relative;overflow:hidden;font-family:"Noto Sans CJK JP",sans-serif;color:var(--navy);background:#fff}
.photo{position:absolute;right:0;top:0;width:640px;height:630px;background:url(students.jpg) 70% center/cover}
.fade{position:absolute;right:420px;top:0;width:220px;height:630px;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.85) 35%,rgba(255,255,255,0) 100%)}
.top{position:absolute;left:56px;top:34px;display:flex;align-items:center;gap:12px}
.top img{width:50px}.top b{font-family:"Noto Serif CJK JP",serif;font-size:22px}
.pr{position:absolute;right:28px;top:28px;background:rgba(255,255,255,.92);border:1px solid #d6d2c8;color:var(--gray);font-size:17px;padding:7px 14px}
.main{position:absolute;left:56px;top:112px;width:640px}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:22px;padding:7px 16px;letter-spacing:.08em}
h1{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:48px;line-height:1.28;margin-top:16px;white-space:nowrap}
h1 em{font-style:normal;color:var(--gold)}
.k{display:flex;align-items:center;gap:12px;margin-top:12px}
.k b{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:32px}
.k span{background:var(--navy);color:#fff;font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:28px;padding:0 12px}
.free{margin-top:12px;font-weight:900;font-size:30px}
.free em{font-style:normal;background:var(--red);color:#fff;padding:0 12px;margin-left:6px}
.parent{position:absolute;left:56px;bottom:118px;font-size:22px;font-weight:700;color:var(--gray)}
.btn{position:absolute;left:56px;bottom:30px;background:var(--red);color:#fff;font-weight:900;font-size:24px;padding:11px 26px;border-radius:4px}
.btn small{display:block;font-size:14px;font-weight:400;opacity:.92;margin-top:1px}
.note{position:absolute;left:330px;bottom:30px;font-size:13px;line-height:1.6;color:var(--gray)}
.cap{position:absolute;right:20px;bottom:16px;font-size:12px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.line{position:absolute;left:0;right:0;bottom:0;height:6px;background:var(--gold)}
</style></head><body>
<div class="photo"></div><div class="fade"></div>
<div class="top"><img src="logo.png"><b>国際ビジネス言語認定協会</b></div>
<div class="pr">Wild English からのご紹介</div>
<div class="main">
<span class="tag">就活生応援キャンペーン</span>
<h1>履歴書を、より<em>強く</em>。<br>強みを、より<em>多く</em>。</h1>
<div class="k"><b>ビジネス英語実務検定</b><span>初級</span></div>
<div class="free">12月25日まで、受験料<em>無料</em></div>
</div>
<div class="parent">お子さまの就活を、応援します。</div>
<div class="btn">▶ 無料で受験する<small>crownbell-kentei.netlify.app/we</small></div>
<div class="note">スマホで20分・24時間いつでも受験<br>国際ビジネス言語認定協会が<br>認定する民間資格です</div>
<div class="cap">※写真はイメージです</div>
<div class="line"></div>
</body></html>
