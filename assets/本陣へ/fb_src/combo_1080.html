<!doctype html><html><head><meta charset="utf-8"><!-- 書体 Oswald：npm pack @fontsource/oswald を oswald/ に展開 --><link rel="stylesheet" href="oswald/700.css"><style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--navy:#16396b;--gold:#f3d58b;--red:#c8102e}
body{width:1080px;height:1080px;position:relative;overflow:hidden;font-family:"Noto Sans CJK JP",sans-serif;color:#fff;background:var(--navy)}
.photo{position:absolute;left:0;right:0;top:0;height:470px;background:url(students.jpg) 60% 30%/cover}
.fade{position:absolute;left:0;right:0;top:320px;height:152px;background:linear-gradient(0deg,var(--navy) 0%,rgba(22,57,107,0) 100%)}
.top{position:absolute;left:30px;right:30px;top:26px;display:flex;justify-content:space-between;align-items:center}
.org{display:flex;align-items:center;gap:12px;background:rgba(22,57,107,.85);padding:8px 18px 8px 10px;border-radius:40px}
.org img{width:44px;height:44px;background:#fff;border-radius:50%}.org b{font-family:"Noto Serif CJK JP",serif;font-size:20px}
.pr{border:1px solid rgba(255,255,255,.7);font-size:17px;padding:7px 14px;background:rgba(22,57,107,.8)}
.cap{position:absolute;right:24px;top:440px;font-size:12px;opacity:.85}
.main{position:absolute;left:64px;right:64px;top:412px}
.tag{display:inline-block;background:var(--red);font-weight:900;font-size:28px;padding:9px 20px;letter-spacing:.08em}
.kentei{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:44px;margin-top:14px}
.row{position:relative;margin-top:56px}
.bubble{position:absolute;left:-8px;top:-46px;background:var(--gold);color:var(--navy);font-weight:900;font-size:24px;padding:6px 18px;border-radius:24px;white-space:nowrap;z-index:2}
.bubble:after{content:"";position:absolute;left:34px;bottom:-10px;border:8px solid transparent;border-top:10px solid var(--gold);border-bottom:0}
.free{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:136px;line-height:1.08;white-space:nowrap}
.free em{font-style:normal;display:inline-block;background:var(--red);padding:6px 14px 10px;margin-left:10px;line-height:1}
.flag{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:44px;margin-top:18px;white-space:nowrap}
.flag em{font-style:normal;color:var(--gold)}
.parent{font-size:28px;margin-top:8px;opacity:.92}
.facts{position:absolute;left:64px;right:238px;bottom:66px;display:flex;gap:12px}
.fact{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.35);border-radius:6px;text-align:center;padding:16px 8px;flex:1}
.fact b{display:block;color:var(--gold);font-size:13px;letter-spacing:.14em}
.fact span{font-weight:700;font-size:22px}
.qrw{position:absolute;right:64px;bottom:52px;background:#fff;border-radius:8px;padding:6px;text-align:center}
.qrw img{display:block;width:142px;height:142px}
.qrw span{display:block;color:var(--navy);font-size:13px;font-weight:700;margin-top:2px}
.note{position:absolute;left:64px;bottom:26px;font-size:14px;opacity:.85}
.line{position:absolute;left:0;right:0;bottom:0;height:8px;background:#c9a24a}
.pr{position:relative;background:none !important;border:none !important;box-shadow:none !important;color:#1d3566 !important;font-family:"Noto Sans CJK JP",sans-serif !important;font-weight:700 !important;font-size:19px !important;padding:8px 26px !important;z-index:1;display:flex;align-items:center;gap:8px}
.pr:before,.pr:after{content:none !important}
.pr .s1,.pr .s2{position:absolute;inset:0;z-index:-1;filter:url(#paint)}
.pr .s1{background:#b8183f;transform:rotate(-2deg) translate(6px,5px)}
.pr .s2{background:#fff;transform:rotate(1deg)}
.pr .dot{position:absolute;border-radius:50%;z-index:-1;filter:url(#paint)}
.pr b{font-family:"Oswald",sans-serif;font-weight:700;font-size:28px;letter-spacing:.02em;line-height:1}
.pr b i{font-style:normal;color:#c8202e}.pr b u{text-decoration:none;color:#1f5fa3}
</style></head><body><svg width="0" height="0" style="position:absolute"><filter id="paint" x="-10%" y="-30%" width="120%" height="160%"><feTurbulence type="fractalNoise" baseFrequency="0.035 0.12" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/></filter></svg>
<div class="photo"></div><div class="fade"></div>
<div class="top"><div class="org"><img src="logo.png"><b>国際ビジネス言語認定協会</b></div><div class="pr"><span class="s1"></span><span class="s2"></span><span class="dot" style="width:14px;height:14px;background:#f2c230;left:-14px;top:-8px"></span><span class="dot" style="width:9px;height:9px;background:#5aa0d8;right:-12px;bottom:-6px"></span><span class="dot" style="width:7px;height:7px;background:#f2c230;right:22px;top:-12px"></span><b><i>WILD</i> <u>ENGLISH</u></b>からのご紹介</div></div>
<div class="main">
<span class="tag">就活生応援キャンペーン</span>
<div class="kentei">ビジネス英語実務検定 初級</div>
<div class="row"><div class="bubble">12月25日まで</div><div class="free">受験料<em>無料</em></div></div>
<div class="flag">履歴書を、より<em>強く</em>。強みを、より<em>多く</em>。</div>
<div class="parent">お子さまの就活を、応援します。</div>
</div>
<div class="facts"><div class="fact"><b>TIME</b><span>20問・20分</span></div><div class="fact"><b>ANYTIME</b><span>スマホで24時間</span></div><div class="fact"><b>CERTIFICATE</b><span>合格証を発行</span></div></div>
<div class="qrw"><img src="qr_we.png"><span>読み取って受験</span></div>
<div class="note">国際ビジネス言語認定協会が認定する民間資格です。無料は初級のみ。※写真はイメージです</div>
<div class="line"></div>
</body></html>
