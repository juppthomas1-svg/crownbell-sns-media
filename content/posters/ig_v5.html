<!doctype html><html><head><meta charset="utf-8"><style>

.name{position:absolute;left:0;right:0;top:1004px;text-align:center}

.cta{position:absolute;left:96px;right:96px;top:1150px;background:linear-gradient(90deg,#c9a85c,#e8cd8a);color:#0a1838;text-align:center;padding:20px 12px}
.cta .a{font-family:"Noto Serif CJK JP",serif;font-weight:900;font-size:46px;line-height:1.2}
.cta .b{margin-top:6px;font-weight:900;font-size:26px}
.cta .b span{display:inline-block;background:#0a1838;color:#e3c47c;padding:4px 14px;margin-left:10px;font-size:22px;letter-spacing:.06em}
.note{position:absolute;left:0;right:0;top:1350px;text-align:center;font-size:15px;color:#b9b3a2}

<div class="frame"></div>
<div class="brand"><img src="logo.png"><div class="n">国際ビジネス言語認定協会</div></div>
<div class="head">このビジネス英語、<br><em>意味わかる？</em></div>
<div class="card">
 <div class="l">社会人なら知っておきたい一言</div>
 <div class="s">“Let's play it by ear.”</div>
 <div class="ctx">来週の段取りを相談したら、上司がひと言。</div>
 <div class="o"><span><b>A</b>相手の話をよく聞いて決めよう</span><span><b>B</b>状況を見ながら、臨機応変にいこう</span><span><b>C</b>音楽を流しながら進めよう</span></div>
 <div class="ans">答え ▶ <span style="display:inline-block;transform:rotate(180deg)">B（臨機応変に）</span></div>
</div>
<div class="name"><div class="k">メール・会議・電話。仕事の英語を測る、新しい資格。</div><h1>ビジネス英語実務検定</h1></div>
<div class="cta"><div class="a">あなたは何問解ける？</div><div class="b">無料10問チャレンジ｜登録不要・約5分<span>プロフィールのリンクから</span></div></div>
<div class="note">お試し問題は本番とは異なり、合格証は発行されません｜民間資格です</div>
</body></html>
